[PHP]
extension_dir = "ext"
extension=pdo_sqlite
extension=sqlite3
extension=mbstring
extension=curl
extension=openssl
extension=fileinfo

memory_limit = 256M
post_max_size = 50M
upload_max_filesize = 50M
max_execution_time = 60

date.timezone = "UTC"
display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
